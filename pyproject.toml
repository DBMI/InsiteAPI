[project]
name = "insiteapi"
version = "0.2.9"
description = "Python library to request All of Us participant data from the National Institutes of Health web service."
authors = [
    {name = "Kevin J. Delaney",email = "kjdelaney@health.ucsd.edu"}
]
license = "This software is Copyright © 2026 The Regents of the University of California. All Rights Reserved. Permission to copy, modify, and distribute this software and its documentation for educational, research and non-profit purposes, without fee, and without a written agreement is hereby granted, provided that the above copyright notice, this paragraph and the following three paragraphs appear in all copies. Permission to make commercial use of this software may be obtained by contacting: Office of Innovation"
readme = "README.md"
requires-python = ">=3.12"

[project.urls]
documentation = "https://github.com/DBMI/InsiteAPI"
homepage = "https://github.com/DBMI/InsiteAPI"
repository = "https://github.com/DBMI/InsiteAPI"

[tool.poetry]
name = "insiteapi"
package-mode = true
# Add this line to explicitly include your src directory:
packages = [{ include = "insiteapi", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12, <4.0"
certifi = "2024.7.4"
configparser = ">=7.3.0, <8.0.0"
idna = "3.7"
logging = "0.4.9.6"
numpy = "2.5.4"
pandas = "3.0.6"
python-dateutil = "3.0.0"
# Windows-only baseline dependency
pywin32 = { version = "^312", markers = "sys_platform == 'win32'" }
pywin32-ctypes = "0.2.3"
requests = "2.34.2"
urllib3 = "2.5.0"

[tool.poetry.group.dev.dependencies]
requests-mock = "*"
pytest = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
